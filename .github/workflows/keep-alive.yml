name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging Render..."
          curl -v --fail --show-error --silent \
            --connect-timeout 10 \
            --max-time 30 \
            https://capstone-food-delivery.onrender.com/api/v2/health
          echo ""
          echo "Ping successful."
